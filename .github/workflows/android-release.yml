name: Android APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Validate tag and package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if ! node -e "const v=process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+$/.test(v)) process.exit(1)" "$VERSION"; then
            echo "Android release tags must be stable SemVer, got $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm run lint

      - name: Sync Capacitor Android project
        run: pnpm run mobile:android:sync

      - name: Android unit tests
        run: pnpm run mobile:android:test

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are incomplete" >&2
            exit 1
          fi
          node scripts/run-android-gradle.mjs assembleRelease

      - name: Prepare release assets
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Lawver-${VERSION}.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Release APK not found at $APK_SOURCE" >&2
            exit 1
          fi
          cp "$APK_SOURCE" "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIZE="$(wc -c < "$APK_NAME" | tr -d ' ')"
          VERSION_CODE="$(node - <<'NODE'
          const version = require('./package.json').version;
          const [, major, minor, patch] = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
          process.stdout.write(String(Number(major) * 1000000 + Number(minor) * 1000 + Number(patch)));
          NODE
          )"
          cat > android-version.json <<JSON
          {
            "platform": "android",
            "packageName": "moe.mutsumi.lawver",
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}",
            "sha256": "${SHA256}",
            "size": ${SIZE},
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_NAME="${{ steps.assets.outputs.apk_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Lawver ${{ steps.version.outputs.version }}" --notes "Android APK release ${{ steps.version.outputs.version }}"
            gh release upload "$TAG" "$APK_NAME" android-version.json --clobber
          else
            gh release create "$TAG" "$APK_NAME" android-version.json --title "Lawver ${{ steps.version.outputs.version }}" --notes "Android APK release ${{ steps.version.outputs.version }}"
          fi
