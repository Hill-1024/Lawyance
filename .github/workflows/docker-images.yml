name: Docker Images

# 功能页镜像推到 GHCR（介绍页镜像由 Lawyance_Intro 仓的 docker-image.yml 负责）。
#
# 为什么单独走 GHCR 而不是在部署机上构建：2B 交付时客户只拿到 compose 文件与镜像，
# 源码与法律语料都不落到客户机器上（docs/law-service-split-plan.md §6 的硬要求）。
# customer 先从 Git 跟踪清单生成受控上下文；客户通过远程 API 使用自营法库。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.22'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: lawver-app
          - target: customer
            image: lawver-customer
    steps:
      - name: Checkout
        env:
          CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$CHECKOUT_REF" || git fetch --depth=1 origin "refs/tags/$CHECKOUT_REF"
          git checkout --detach FETCH_HEAD

      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          # GHCR 拒绝大写 owner，必须小写化
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')"
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "image=ghcr.io/${OWNER}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare customer build context
        if: matrix.target == 'customer'
        run: python3 scripts/package-customer.py --build-context "$RUNNER_TEMP/lawver-customer-context"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target == 'customer' && format('{0}/lawver-customer-context', runner.temp) || '.' }}
          file: ${{ matrix.target == 'customer' && format('{0}/lawver-customer-context/deploy/docker/Dockerfile', runner.temp) || 'deploy/docker/Dockerfile' }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
