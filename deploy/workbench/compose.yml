services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawver
      POSTGRES_USER: lawver
      POSTGRES_PASSWORD: ${LAWVER_POSTGRES_PASSWORD:?Set a strong database password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lawver-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lawver -d lawver']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  lawver-postgres:
