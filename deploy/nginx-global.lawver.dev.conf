# global.lawver.dev
# 母域 lawver.dev；cn.lawver.dev 留给国内版；本文件只托管国际站。
# 东盟板块在 /asean/，以后可并列 /其他板块/。
#
# 构建：
#   VITE_PUBLIC_BASE=/asean/ pnpm build
# 后端监听 127.0.0.1:8080，反代会剥掉 /asean 前缀。

server {
    listen 443 ssl http2;
    server_name global.lawver.dev;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location /asean/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /asean;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = / {
        return 302 /asean/;
    }
}
