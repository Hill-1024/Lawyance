<!DOCTYPE html>
<!--
  维护页：由分流核心自己回答，不依赖任何一侧后端。
  占位符在路由核心里替换：__SIDE_LABEL__ / __FROM__ / __RETRY_MS__ / __STATUS_URL__。
  自包含（无外链、无字体请求）：功能页或介绍页下线时，这个页面必须第一个站出来。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>维护中 | Lawver</title>
    <style>
      :root {
        --bg-app: #f6f8fb;
        --fg-1: #14171f;
        --fg-3: #6b7385;
        --border-default: rgba(20, 23, 31, 0.1);
        --brand-ink: #1a2238;
        --accent: #3b62b8;
        --radius-md: 14px;
        --radius-pill: 999px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-app: #0b0d14;
          --fg-1: #eceef3;
          --fg-3: #8b92a4;
          --border-default: rgba(255, 255, 255, 0.1);
          --brand-ink: #f6f8fb;
          --accent: #8aa4dd;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: var(--bg-app);
        color: var(--fg-1);
        font-family: "Inter", "Noto Sans SC", ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(420px, 100%);
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 44px 32px 36px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--bg-app) 88%, var(--fg-1) 12%);
        text-align: center;
      }
      .mark {
        width: 40px;
        height: 40px;
        margin-bottom: 2px;
      }
      .eyebrow {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      h1 {
        margin: 0;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.3;
      }
      .lead {
        margin: 0;
        font-size: 16px;
        line-height: 26px;
      }
      .hint,
      .meta {
        margin: 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--fg-3);
      }
      .meta {
        min-height: 20px;
      }
      button {
        margin-top: 6px;
        padding: 9px 22px;
        border: 1px solid transparent;
        border-radius: var(--radius-pill);
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.06);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <g stroke="var(--brand-ink)" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M38 18 C38 18 36 20 36 26 L36 64 C36 70 38 72 42 72 L70 72" stroke-width="2.2" />
          <path d="M30 18 L46 18" stroke-width="1.2" />
          <path d="M70 70 L70 74" stroke-width="1.2" />
          <line x1="14" y1="78" x2="82" y2="78" stroke-width="0.75" opacity="0.55" />
          <circle cx="26" cy="82" r="1.2" fill="var(--brand-ink)" stroke="none" />
          <circle cx="70" cy="82" r="1.2" fill="var(--brand-ink)" stroke="none" />
        </g>
        <circle cx="50" cy="14" r="1.4" fill="var(--brand-ink)" />
      </svg>
      <p class="eyebrow">Lawver</p>
      <h1>维护中</h1>
      <p class="lead">我们很快就会回来。</p>
      <p class="hint">
        <span data-label>__SIDE_LABEL__</span>正在维护，本页每 <span data-interval></span> 秒自动检查，
        恢复后自动返回。
      </p>
      <button id="retry" type="button">立即重试</button>
      <p class="meta" id="meta" role="status" aria-live="polite"></p>
    </main>
    <script>
      (function () {
        var FROM = __FROM__;
        var STATUS_URL = "__STATUS_URL__";
        var INTERVAL = __RETRY_MS__;
        var RETRYING = "仍在维护中……";
        var OFFLINE = "暂时联系不上服务，稍后自动重试。";

        var meta = document.getElementById("meta");
        var label = document.querySelector("[data-label]");
        var intervalSlot = document.querySelector("[data-interval]");
        if (intervalSlot) intervalSlot.textContent = String(Math.round(INTERVAL / 1000));

        function setMeta(text) {
          if (meta.textContent !== text) meta.textContent = text;
        }

        function labelFor(down) {
          if (down.length > 1) return "服务";
          return down[0] === "app" ? "工作台" : "介绍页";
        }

        function check() {
          return fetch(STATUS_URL, { cache: "no-store" })
            .then(function (response) {
              if (!response.ok) return null;
              return response.json();
            })
            .then(function (data) {
              if (!data || !data.sides) {
                setMeta(OFFLINE);
                return;
              }
              var down = Object.keys(data.sides).filter(function (name) {
                return !data.sides[name].up;
              });
              if (!down.length) {
                window.location.replace(FROM || "/");
                return;
              }
              if (label) label.textContent = labelFor(down);
              setMeta(RETRYING);
            })
            .catch(function () {
              setMeta(OFFLINE);
            });
        }

        document.getElementById("retry").addEventListener("click", function () {
          setMeta("正在检查……");
          check();
        });

        window.setInterval(check, INTERVAL);
        window.setTimeout(check, 400);
      })();
    </script>
  </body>
</html>
